# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.10.0/ibek.support.schema.json

# Imported from DLS production support module: BL05I 2-95
# Source: controls/support/BL05I (DLS GitLab), tag 2-95, BL05IApp/Db
# (built copies in /dls_sw/prod/R3.14.12.7/support/BL05I/2-95/db).
#
# Files and how each was obtained:
# - Pristine copies of the release's templates: every *.template here except
#   the two hexapod mirror templates below. That includes
#   BL05I_waterChiller.template, byte-identical to the release's db/ copy.
# - Translated: BL05I_changeHexapodMirror.template and
#   BL05I_changeHexapodMirror_withReference.template. In the release their
#   records talk to the GeoBrick through StreamDevice and BL05I's own
#   changeHexapod.proto. Here those records use the pmac driver's variable
#   access instead (asyn parameters PMAC_VI<loop>_<var>, PMAC_WI_<var> and
#   PMAC_C_WRITE_CMD of pmac 2-7-9's pmacController), and the 0.2 s poller
#   record FAN:UPDATE is gone because the driver polls the variables. Why:
#   generic pmac variable access instead of a beamline protocol file,
#   decision 2026-11-27. Only the transport changed; the record logic, its
#   known defects included, is as released, apart from PINI YES on the three
#   readbacks FAN:UPDATE processed. Each template's header says what
#   changed, and each translated record carries a "# was:" comment with its
#   StreamDevice DTYP and INP/OUT.
# - BL05I_waterChiller_settings.req: the PVs of BL05I_waterChiller.template's
#   autosave tags.
# - *.pvi.device.yaml: the PVI screens of the hexapod mirror and water chiller
#   models, first written by ibek-runtime-streamdevice's generate-pvi.py and
#   maintained by hand here.
#
# BL05I is the I05 beamline's support module; it also carries the templates of
# the J (nano-ARPES) branch, BL05J. Most of its templates use only soft records:
# ai, ao, bi, bo, calc, calcout, dfanout, fanout, longout, mbbi, mbbiDirect,
# mbbo, seq, stringin, stringout and subArray from EPICS base; scalcout, sseq
# and transform from calc; busy from busy; and timestamp from std, which only
# BL05I_He_Recovery uses. So they run on a stock generic IOC image without
# compiling the module. Three models need more of the image:
# - BL05I_changeHexapodMirror and BL05I_changeHexapodMirror_withRef: asyn
#   records on a pmac controller (pmac.GeoBrick or pmac.PMAC), plus calc and
#   busy, so a pmac image such as ioc-pmac. PmacController names that
#   controller; the builder class took PORT, the asyn IP port to the GeoBrick.
# - BL05I_waterchiller: StreamDevice records using Hostlink.proto, and an asyn
#   record, so an image with StreamDevice and asyn. Hostlink.proto is not in
#   this pattern: add the HostLink pattern of ibek-runtime-streamdevice to the
#   same IOC instance. It vendors the protocol into config/, from where the
#   IOC places it on STREAM_PROTOCOL_PATH. Use HostLink from
#   ibek-runtime-streamdevice 0.9.0 or later, the first release with
#   Hostlink.proto.
#
# Entity model names are the builder class names, and the auto_* models are
# builder's automatic classes for the templates that have no class of their
# own: auto_<template> loads <template>.template. Parameter names are the
# builder XML attribute names, apart from the hexapod models' PmacController.
# The builder `name` parameter is not declared: no template uses it in a
# record, and builder2ibek drops it. DESC of BL05I_HR_manipulator is declared
# although only a GDA tag comment uses it, because an i05 IOC sets it.
# BL05I_waterchiller takes WPDESC and UVDESC, which the template gives two
# different defaults each; the defaults here are its longer ones.
#
# Two templates override records that another module loads, so their entity
# must come after that module's entity in ioc.yaml:
# - auto_BL05I_mks937bGauge_pressureOverride redefines <GAUGE>:P of the
#   mks937b gauge.
# - auto_BL05I_slit_BPM_dummies sets fields of <SLITS>:POSCALC of the slits.
#
# Not in this pattern:
# - auto_BL05I-digitelMpcIonpOverride: one StreamDevice record with
#   digitelMpc.proto, and a hyphen in its name that is not a valid entity
#   model name. No i05 IOC uses it.
#
# Only the templates and model entities an IOC actually needs may be vendored using:
# 'ibek pattern add ibek-runtime-support:BL05I@<release> <service> --only <template> --model <entity_model>'
#
# To check for updates: diff the pristine files against a newer tag of
# controls/support/BL05I (BL05IApp/Db). For the two translated templates, diff
# the release's own copies between the two tags and carry any change across.

module: BL05I

entity_models:
  - name: BL05I_waterchiller_interlock
    description: |-
      Shows the status of the MPS interlocks of one device of the water
      chiller PLC: 16 interlock bits read from the device's interlock word.
    parameters:
      device:
        type: str
        description: |-
          Device record prefix of the subcomponent of the water chiller
          system. Used to build record names.
      DDESC:
        type: str
        description: |-
          Sub device description. Keep it short: the template adds to it on
          several records.
      ilk0:
        type: str
        description: Name of interlock bit 0
        default: unused
      ilk1:
        type: str
        description: Name of interlock bit 1
        default: unused
      ilk2:
        type: str
        description: Name of interlock bit 2
        default: unused
      ilk3:
        type: str
        description: Name of interlock bit 3
        default: unused
      ilk4:
        type: str
        description: Name of interlock bit 4
        default: unused
      ilk5:
        type: str
        description: Name of interlock bit 5
        default: unused
      ilk6:
        type: str
        description: Name of interlock bit 6
        default: unused
      ilk7:
        type: str
        description: Name of interlock bit 7
        default: unused
      ilk8:
        type: str
        description: Name of interlock bit 8
        default: unused
      ilk9:
        type: str
        description: Name of interlock bit 9
        default: unused
      ilk10:
        type: str
        description: Name of interlock bit 10
        default: unused
      ilk11:
        type: str
        description: Name of interlock bit 11
        default: unused
      ilk12:
        type: str
        description: Name of interlock bit 12
        default: unused
      ilk13:
        type: str
        description: Name of interlock bit 13
        default: unused
      ilk14:
        type: str
        description: Name of interlock bit 14
        default: unused
      ilk15:
        type: str
        description: Name of interlock bit 15
        default: unused
    databases:
      - file: BL05I_waterChiller_interlock.template
        args:
          .*:

  - name: BL05I_pgmHomingSteps
    description: |-
      Provides GUI information about the status of the various steps
      involved in the homing of the PGM (homing PLC10).
    parameters:
      P:
        type: str
        description: PV prefix
      R:
        type: str
        description: PV suffix
      HM:
        type: str
        description: |-
          PV suffix of the homing status records from the homing template
          definitions
      HMC:
        type: str
        description: |-
          PV suffix of the custom homing status records from the
          pmacVariableWrite template definitions
      STEP:
        type: int
        description: Step number of the PLC homing step
      DESCNAME:
        type: str
        description: Descriptive name of the PLC homing step
    databases:
      - file: BL05I_PGM_homingPLC_steps.template
        args:
          .*:

  - name: BL05I_FeedbackAutoPv
    description: |-
      Shutter-like AutoPV for BLfeedback.
      Triggers feedback for a given period of time, but not when TopUp
      is about to occur.
    parameters:
      prefix:
        type: str
        description: EPICS PV prefix
      FEEDBACK_TIME:
        type: float
        description: Duration of feedback, in seconds
      PULSE_DELAY:
        type: float
        description: Number of seconds between feedback pulses in Pulsed mode
      DESC:
        type: str
        description: Description of this template in IOC
    databases:
      - file: BL05I_Feedback_AutoPV.template
        args:
          .*:

  - name: BL05I_HR_manipulator
    description: |-
      HR branch end station sample manipulator: sequencer that moves all
      axes to one of a set of stored positions.
    parameters:
      P:
        type: str
        description: Device PV prefix
      DESC:
        type: str
        description: |-
          GDA description of the positioner. Used only in a GDA tag, not in
          a record.
        default: ES Manipulator 1
    databases:
      - file: BL05I_HR_manipulator.template
        args:
          .*:

  - name: BL05I_HR_manipulatorLimit
    description: |-
      Applies a motion limit dependent on switches and/or exclusion zones.
    parameters:
      P:
        type: str
        description: Device prefix
      R:
        type: str
        description: Record name prefix
      LIM1:
        type: float
        description: Limit value when switch 1 is active
      LIM2:
        type: float
        description: Limit value when switch 2 is active
      LIM3:
        type: float
        description: Limit value when switch 3 is active
      LIM4:
        type: float
        description: Limit value when no switch is active
      SW1:
        type: str
        description: Record name of switch 1 state signal
      SW2:
        type: str
        description: Record name of switch 2 state signal
      SW3:
        type: str
        description: Record name of switch 3 state signal
      MTRLIM:
        type: str
        description: Name of motor record limit field to restrict
      LIMTYPE:
        type: int
        description: |-
          Type of motion limit, also whether the exclusion zones feature is
          enabled: 0 for LO, 1 for Disabled or 2 for HI
        default: 1
      EGU:
        type: str
        description: Engineering units on the motion axis
        default: ""
    databases:
      - file: BL05I_HR_manipulatorLimit.template
        args:
          .*:

  - name: BL05I_HR_manipulatorSlit
    description: |-
      Calculates the analyser slit position string from an analogue input
      voltage, for the HR branch end station.
    parameters:
      P:
        type: str
        description: Device PV prefix
      R:
        type: str
        description: Record PV prefix
      SLIT:
        type: str
        description: Analogue input voltage of slit position
    databases:
      - file: BL05I_HR_manipulatorSlit.template
        args:
          .*:

  - name: BL05I_HR_manipulatorXZone
    description: |-
      Defines a manipulator exclusion zone: a motion limit dependent on the
      position of a different axis. Works with the records of a
      BL05I_HR_manipulatorLimit with the same P and R.
    parameters:
      P:
        type: str
        description: |-
          Device name. Use the same as that of the manipulatorLimit to
          override.
      R:
        type: str
        description: |-
          Record name. Use the same as that of the manipulatorLimit to
          override.
      XZ:
        type: str
        description: Name given to this exclusion trigger combination
      XLIM:
        type: float
        description: Exclusion limit value to apply to the excluded motor
      XTYPE:
        type: int
        description: |-
          Type of exclusion: 0 for LO, 1 for Not Active or 2 for HI
        default: 1
      XEGU:
        type: str
        description: Engineering units on the excluded axis
        default: ""
      ZLIM:
        type: float
        description: |-
          The limit value which defines the zone where the exclusion is
          active; the motor triggers exclusion by moving past it
      ZTYPE:
        type: int
        description: |-
          The comparison against ZLIM that makes the zone active: 0 for LO,
          1 for Not Active or 2 for HI
        default: 1
      ZMTR:
        type: str
        description: The motor whose position defines the exclusion zone
    databases:
      - file: BL05I_HR_manipulatorXZone.template
        args:
          .*:

  - name: BL05I_HR_manipulatorXZoneSet
    description: |-
      Selects which exclusion zone to enforce: combines up to five
      exclusion zones of one axis limit and applies the most restrictive.
    parameters:
      P:
        type: str
        description: Device prefix
      R:
        type: str
        description: Record name prefix
      XZS:
        type: str
        description: Name of the exclusion set
      LIM:
        type: str
        description: |-
          Prefix for the limit records defined by the manipulatorLimit
          template
      XTRLIM:
        type: str
        description: |-
          Value of limit guaranteed to be outside the range of valid values
      XSTATE1:
        type: str
        description: Name of the record holding the state of exclusion 1
        default: "1"
      XLIM1:
        type: str
        description: Name of the record holding the limit of exclusion 1
        default: "{{XTRLIM}}"
      XSTATE2:
        type: str
        description: Name of the record holding the state of exclusion 2
        default: "1"
      XLIM2:
        type: str
        description: Name of the record holding the limit of exclusion 2
        default: "{{XTRLIM}}"
      XSTATE3:
        type: str
        description: Name of the record holding the state of exclusion 3
        default: "1"
      XLIM3:
        type: str
        description: Name of the record holding the limit of exclusion 3
        default: "{{XTRLIM}}"
      XSTATE4:
        type: str
        description: Name of the record holding the state of exclusion 4
        default: "1"
      XLIM4:
        type: str
        description: Name of the record holding the limit of exclusion 4
        default: "{{XTRLIM}}"
      XSTATE5:
        type: str
        description: Name of the record holding the state of exclusion 5
        default: "1"
      XLIM5:
        type: str
        description: Name of the record holding the limit of exclusion 5
        default: "{{XTRLIM}}"
    databases:
      - file: BL05I_HR_manipulatorXZoneSet.template
        args:
          .*:

  - name: BL05I_He_Recovery
    description: |-
      Calculates the Helium gas recovery percentage and the liquid Helium
      consumption rate, by comparing the liquid Helium weight in the
      beamline Dewar with the gas returned to the recovery plant.
    parameters:
      P:
        type: str
        description: Device PV prefix
      R:
        type: str
        description: Device PV suffix
      GAS_VOLUME:
        type: str
        description: |-
          The calc PV that provides the gas volume recorded at the recovery
          plant
      LIQUID_WEIGHT:
        type: str
        description: |-
          The analogue input PV that provides the liquid gas weight in the
          Dewar at the beamline
      M3_TO_LTR:
        type: float
        description: |-
          Coefficient to convert from cubic metres to litres, taking into
          account the density of the gas phase (1 m3 = 1.3245 L for Helium)
        default: 1.3245
      KG_TO_LTR:
        type: float
        description: |-
          Coefficient to convert from kilograms to litres, taking into
          account the density of the liquid phase (1 kg = 8.0 L for Helium)
        default: 8.0
      AVG_PERIOD:
        type: float
        description: |-
          The averaging period, in seconds, used to calculate each gas
          recovery data point
        default: 600
    databases:
      - file: BL05I_Helium_recovery.template
        args:
          .*:

  - name: BL05I_changeHexapodMirror
    description: |-
      Interfaces to a Delta Tau PLC for changing a hexapod set up from one mirror
      to another (a new Y value for the Tool Centre Point, then another PLC
      recalculates everything). Assumes 2 mirrors.
    parameters:
      P:
        type: str
        description: |-
          Device PV Prefix
      R:
        type: str
        description: |-
          Record PV Prefix
      PLC:
        type: int
        description: |-
          PLC number of Delta Tau PLC to interface with
      PmacController:
        type: object
        description: |-
          The pmac controller (pmac.GeoBrick or pmac.PMAC) of the Delta Tau
          that runs the PLC: the records read and write its variables through
          that controller's asyn port. The builder class took PORT, the asyn IP
          port to the controller, instead.
      YMTR:
        type: str
        description: |-
          Name of the motor record for the Y-translation of the hexapod (not
          declared in this template)
      M1NAME:
        type: str
        description: |-
          Name or label string for first mirror
        default: Mirror1
      M2NAME:
        type: str
        description: |-
          Name or label string for second mirror
        default: Mirror2
      M1HLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using first mirror
        default: 45.0
      M2HLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using second mirror
        default: 107.0
      M1LLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using first mirror
        default: -45.0
      M2LLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using second mirror
        default: 17.0
    databases:
      - file: BL05I_changeHexapodMirror.template
        args:
          P:
          R:
          PLC:
          PORT: "{{ PmacController }}"
          YMTR:
          M1NAME:
          M2NAME:
          M1HLM:
          M2HLM:
          M1LLM:
          M2LLM:
    pvi:
      yaml_path: BL05I_changeHexapodMirror.pvi.device.yaml
      ui_macros:
        P:
        R:
        PLC:
        M1NAME:
        M2NAME:

  - name: BL05I_changeHexapodMirror_withRef
    description: |-
      Interfaces to a Delta Tau PLC for changing a hexapod set up from one mirror
      to another (a new Y value for the Tool Centre Point, then another PLC
      recalculates everything). Assumes 2 mirrors and adds a third position for
      the reference or ideal position; works with the updated mirror change PLC.
    parameters:
      P:
        type: str
        description: |-
          Device PV Prefix
      R:
        type: str
        description: |-
          Record PV Prefix
      PLC:
        type: int
        description: |-
          PLC number of Delta Tau PLC to interface with
      PmacController:
        type: object
        description: |-
          The pmac controller (pmac.GeoBrick or pmac.PMAC) of the Delta Tau
          that runs the PLC: the records read and write its variables through
          that controller's asyn port. The builder class took PORT, the asyn IP
          port to the controller, instead.
      YMTR:
        type: str
        description: |-
          Name of the motor record for the Y-translation of the hexapod (not
          declared in this template)
      M1NAME:
        type: str
        description: |-
          Name or label string for first mirror
        default: Mirror1
      M2NAME:
        type: str
        description: |-
          Name or label string for second mirror
        default: Mirror2
      MREFNAME:
        type: str
        description: |-
          Name or label string for the reference position
        default: Reference
      M1HLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using first mirror
        default: 45.0
      M2HLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using second mirror
        default: 107.0
      MREFHLM:
        type: float
        description: |-
          High soft limit value for Y motor record when using reference position
        default: 76.0
      M1LLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using first mirror
        default: -45.0
      M2LLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using second mirror
        default: 17.0
      MREFLLM:
        type: float
        description: |-
          Low soft limit value for Y motor record when using reference position
        default: -14.0
    databases:
      - file: BL05I_changeHexapodMirror_withReference.template
        args:
          P:
          R:
          PLC:
          PORT: "{{ PmacController }}"
          YMTR:
          M1NAME:
          M2NAME:
          M1HLM:
          M2HLM:
          M1LLM:
          M2LLM:
          MREFNAME:
          MREFHLM:
          MREFLLM:
    pvi:
      yaml_path: BL05I_changeHexapodMirror_withRef.pvi.device.yaml
      ui_macros:
        P:
        R:
        PLC:
        M1NAME:
        M2NAME:
        MREFNAME:

  - name: BL05I_waterchiller
    description: |-
      Monitoring and control of a DLS designed and built water chiller circuit
      controlled by an Omron PLC over HostLink.
      Its records use Hostlink.proto, which the HostLink pattern of
      ibek-runtime-streamdevice supplies: add that pattern to the IOC too.
    parameters:
      P:
        type: str
        description: |-
          Prefix for the system name as a whole.
      R:
        type: str
        description: |-
          Record name for the system. PV names constructed as <P><R>:blah
        default: ""
      PLCNAME:
        type: str
        description: |-
          Name of the HO PLC.
      port:
        type: str
        description: |-
          Asyn port to talk to the HO PLC.
      DISABLED:
        type: int
        description: |-
          Default of whether to poll the device from boot time or not - useful during commissioning or if for some other reason the PLC is not available to the IOC. 0 for Enabled, 1 for Disabled.
        default: 0
      PLCDESC:
        type: str
        description: |-
          Description of the water chiller system controlled by the HO PLC.
        default: "{{ P }}{{ R }}"
      P1NAME:
        type: str
        description: |-
          Device name of the first pressure sensor in the system.
        default: "{{ PLCNAME }}:P1"
      P2NAME:
        type: str
        description: |-
          Device name of the second pressure sensor in the system.
        default: "{{ PLCNAME }}:P2"
      F1NAME:
        type: str
        description: |-
          Device name of the first flow sensor in the system.
        default: "{{ PLCNAME }}:F1"
      F2NAME:
        type: str
        description: |-
          Device name of the second flow sensor in the system.
        default: "{{ PLCNAME }}:F2"
      T1NAME:
        type: str
        description: |-
          Device name of the first temperature sensor in the system.
        default: "{{ PLCNAME }}:T1"
      T2NAME:
        type: str
        description: |-
          Device name of the second temperature sensor in the system.
        default: "{{ PLCNAME }}:T2"
      T3NAME:
        type: str
        description: |-
          Device name of the third temperature sensor in the system.
        default: "{{ PLCNAME }}:T3"
      T4NAME:
        type: str
        description: |-
          Device name of the fourth temperature sensor in the system.
        default: "{{ PLCNAME }}:T4"
      T5NAME:
        type: str
        description: |-
          Device name of the fifth temperature sensor in the system.
        default: "{{ PLCNAME }}:T5"
      T6NAME:
        type: str
        description: |-
          Device name of the sixth temperature sensor in the system.
        default: "{{ PLCNAME }}:T6"
      V1NAME:
        type: str
        description: |-
          Device name of the first valve in the system.
        default: "{{ PLCNAME }}:V1"
      V2NAME:
        type: str
        description: |-
          Device name of the second valve in the system.
        default: "{{ PLCNAME }}:V2"
      WPNAME:
        type: str
        description: |-
          Device name of the Water pump in the system.
        default: "{{ PLCNAME }}:TRBNP"
      UVNAME:
        type: str
        description: |-
          Device name of the UV Steriliser in the system.
        default: "{{ PLCNAME }}:UVSTL"
      PEGU:
        type: str
        description: |-
          Engineering units to display pressures in.
        default: "mbar"
      FEGU:
        type: str
        description: |-
          Engineering units to display flows in.
        default: "l/min"
      TEGU:
        type: str
        description: |-
          Engineering units to display temperatures in.
        default: "degC"
      VEGU:
        type: str
        description: |-
          Engineering units to display valve position in.
        default: "%"
      SEGU:
        type: str
        description: |-
          Engineering units to display time parameters in.
        default: "s"
      P1ESLO:
        type: float
        description: |-
          Linear slope to convert P1NAME raw value to PEGU.
        default: 1.0
      P2ESLO:
        type: float
        description: |-
          Linear slope to convert P2NAME raw value to PEGU.
        default: 1.0
      F1ESLO:
        type: float
        description: |-
          Linear slope to convert F1NAME raw value to FEGU.
        default: 1.0
      F2ESLO:
        type: float
        description: |-
          Linear slope to convert F2NAME raw value to FEGU.
        default: 1.0
      T1ESLO:
        type: float
        description: |-
          Linear slope to convert T1NAME raw value to TEGU.
        default: 0.1
      T2ESLO:
        type: float
        description: |-
          Linear slope to convert T2NAME raw value to TEGU.
        default: 0.1
      T3ESLO:
        type: float
        description: |-
          Linear slope to convert T3NAME raw value to TEGU.
        default: 0.1
      T4ESLO:
        type: float
        description: |-
          Linear slope to convert T4NAME raw value to TEGU.
        default: 0.1
      T5ESLO:
        type: float
        description: |-
          Linear slope to convert T5NAME raw value to TEGU.
        default: 0.1
      T6ESLO:
        type: float
        description: |-
          Linear slope to convert T6NAME raw value to TEGU.
        default: 0.1
      V1ESLO:
        type: float
        description: |-
          Linear slope to convert V1NAME raw value to VEGU.
        default: 0.025
