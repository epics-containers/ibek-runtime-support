  - name: auto_BL05JpvRamp
    description: |-
      Ramps the voltage of a detector power supply, for the J branch end
      station: drives an analogue output PV at a set ramp rate, where
      output = EGU * SCALE + OFFSET.
    parameters:
      P:
        type: str
        description: Device PV prefix
      OUTPV:
        type: str
        description: The analogue output PV that controls the PSU
      EGU:
        type: str
        description: Engineering units
        default: V
      SCALE:
        type: float
        description: Conversion factor from EGU to the output PV value
        default: 1
      OFFSET:
        type: float
        description: Conversion offset from EGU to the output PV value
        default: 0
      MAXEGU:
        type: float
        description: Maximum EGU the PSU supports
        default: 10000
      MINRAMPEGU:
        type: float
        description: Minimum EGU that the user can ramp to
        default: 0
      MAXRAMPEGU:
        type: float
        description: Maximum EGU that the user can ramp to
        default: 10000
      RR:
        type: float
        description: Initial (first boot) ramp rate in EGU/s
        default: 10
      MINRR:
        type: float
        description: Minimum allowed ramp rate in EGU/s
        default: 1
      MAXRR:
        type: float
        description: Maximum allowed ramp rate in EGU/s
        default: 10000
    databases:
      - file: BL05JpvRamp.template
        args:
          .*:

