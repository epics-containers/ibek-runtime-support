# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

module: detectorPlugins

entity_models:
  - name: gdaPlugins
    description: |-
      Standard set of AreaDetector plugins for GDA.
      Replaces the DLS builder object adUtil.gdaPlugins (adUtil 2-44): the same
      plugins, PV names, parameters and defaults, the GDA helper records of
      gdaPlugins.template, and the same post-iocInit settings. STAT1-STAT6 are
      fed from ROI1-ROI6 (the builder feeds them all from ROI1) and PVA uses
      NDPvxsPlugin in place of NDPvaPlugin.
    parameters:
      P:
        type: str
        description: PV prefix for all plugins
      CAM:
        type: str
        description: AreaDetector NDArray port name of the camera
      PORTPREFIX:
        type: str
        description: Asyn port name prefix for each plugin
      PLUGINQUEUE:
        type: int
        description: Size of queue for each plugin (except NDStdArrays and ffmpegStream)
        default: 16
      DISPLAYQUEUE:
        type: int
        description: Size of queue for the NDStdArrays and ffmpegStream plugins
        default: 2
      HIST_SIZE:
        type: int
        description: Size of histogram in NDStats plugins
        default: 256
      NCHANS:
        type: int
        description: Number of elements in the NDStats waveforms for past statistics
        default: 1024
      XSIZE:
        type: int
        description: Size of NDStats X Histograms
        default: 1024
      YSIZE:
        type: int
        description: Size of NDStats Y Histograms
        default: 1024
      NELEMENTS:
        type: int
        description: Size of NDStdArrays waveform (should equal the number of pixels in the image)
        default: 786432
      ARRFTVL:
        type: str
        description: Data format of NDStdArrays waveform
        default: UCHAR
      ARRTYPE:
        type: str
        description: Asyn Array type of NDStdArrays waveform
        default: Int8
      HTTP_PORT:
        type: int
        description: Port used for ffmpegStream plugin
        default: 8080
      CentroidThreshold:
        type: int
        description: Threshold for calculating centroids in NDStats plugins
        default: 50
      ComputeProfiles:
        type: int
        description: Toggle computation of profiles in NDStats plugins (0 or 1)
        default: 1
      ComputeStatistics:
        type: int
        description: Toggle computation of basic statistics in NDStats plugins (0 or 1)
        default: 0
      ComputeCentroid:
        type: int
        description: Toggle computation of centroids in NDStats plugins (0 or 1)
        default: 0
      threads:
        type: int
        description: Number of threads (1-16) to use for the Stat and ROI plugins
        default: 1
      threadSortTime:
        type: float
        description: Time to allow for correct uniqueID arrival for sorting NDArrays
        default: 1.0
      threadSortSize:
        type: int
        description: Max size of queue used to keep threads in the correct output order
        default: 1000

    sub_entities:
      - type: ADCore.NDROI
        ENABLED: 1
        MAX_THREADS: 16
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.roi"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":ROI:"

      - type: ADCore.NDROI
        MAX_THREADS: 16
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.rois.roi1"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":ROI1:"

      - type: ADCore.NDROI
        MAX_THREADS: 16
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.rois.roi2"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":ROI2:"

      - type: ADCore.NDROI
        MAX_THREADS: 16
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.rois.roi3"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":ROI3:"

      - type: ADCore.NDROI
        MAX_THREADS: 16
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.rois.roi4"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":ROI4:"

      - type: ADCore.NDROI
        MAX_THREADS: 16
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.rois.roi5"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":ROI5:"

      - type: ADCore.NDROI
        MAX_THREADS: 16
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.rois.roi6"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":ROI6:"

      - type: ADCore.NDStats
        ATTRIBUTES_FILE: gdaPluginsStats.xml
        ENABLED: 1
        HIST_SIZE: "{{ HIST_SIZE }}"
        MAX_THREADS: 16
        NCHANS: "{{ NCHANS }}"
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.stat"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":STAT:"
        XSIZE: "{{ XSIZE }}"
        YSIZE: "{{ YSIZE }}"

      - type: ADCore.NDStats
        ATTRIBUTES_FILE: gdaPluginsStats.xml
        HIST_SIZE: "{{ HIST_SIZE }}"
        MAX_THREADS: 16
        NCHANS: "{{ NCHANS }}"
        NDARRAY_PORT: "{{ PORTPREFIX }}.rois.roi1"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.stats.stat1"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":STAT1:"
        XSIZE: "{{ XSIZE }}"
        YSIZE: "{{ YSIZE }}"

      - type: ADCore.NDStats
        ATTRIBUTES_FILE: gdaPluginsStats.xml
        HIST_SIZE: "{{ HIST_SIZE }}"
        MAX_THREADS: 16
        NCHANS: "{{ NCHANS }}"
        NDARRAY_PORT: "{{ PORTPREFIX }}.rois.roi2"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.stats.stat2"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":STAT2:"
        XSIZE: "{{ XSIZE }}"
        YSIZE: "{{ YSIZE }}"

      - type: ADCore.NDStats
        ATTRIBUTES_FILE: gdaPluginsStats.xml
        HIST_SIZE: "{{ HIST_SIZE }}"
        MAX_THREADS: 16
        NCHANS: "{{ NCHANS }}"
        NDARRAY_PORT: "{{ PORTPREFIX }}.rois.roi3"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.stats.stat3"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":STAT3:"
        XSIZE: "{{ XSIZE }}"
        YSIZE: "{{ YSIZE }}"

      - type: ADCore.NDStats
        ATTRIBUTES_FILE: gdaPluginsStats.xml
        HIST_SIZE: "{{ HIST_SIZE }}"
        MAX_THREADS: 16
        NCHANS: "{{ NCHANS }}"
        NDARRAY_PORT: "{{ PORTPREFIX }}.rois.roi4"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.stats.stat4"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":STAT4:"
        XSIZE: "{{ XSIZE }}"
        YSIZE: "{{ YSIZE }}"

      - type: ADCore.NDStats
        ATTRIBUTES_FILE: gdaPluginsStats.xml
        HIST_SIZE: "{{ HIST_SIZE }}"
        MAX_THREADS: 16
        NCHANS: "{{ NCHANS }}"
        NDARRAY_PORT: "{{ PORTPREFIX }}.rois.roi5"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.stats.stat5"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":STAT5:"
        XSIZE: "{{ XSIZE }}"
        YSIZE: "{{ YSIZE }}"

      - type: ADCore.NDStats
        ATTRIBUTES_FILE: gdaPluginsStats.xml
        HIST_SIZE: "{{ HIST_SIZE }}"
        MAX_THREADS: 16
        NCHANS: "{{ NCHANS }}"
        NDARRAY_PORT: "{{ PORTPREFIX }}.rois.roi6"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.stats.stat6"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":STAT6:"
        XSIZE: "{{ XSIZE }}"
        YSIZE: "{{ YSIZE }}"

      - type: ADCore.NDStdArrays
        R: ":ARR:"
        FTVL: "{{ ARRFTVL }}"
        NDARRAY_PORT: "{{ PORTPREFIX }}.roi"
        NELEMENTS: "{{ NELEMENTS }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.arr"
        QUEUE: "{{ DISPLAYQUEUE }}"
        TYPE: "{{ ARRTYPE }}"

      - type: ADCore.NDProcess
        ENABLED: 1
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.proc"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":PROC:"

      - type: ADCore.NDOverlay
        ENABLED: 1
        NDARRAY_PORT: "{{ PORTPREFIX }}.proc"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.over"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":OVER:"

      # ffmpegFile has no ENABLED parameter: gdaPlugins.template enables it
      - type: ffmpegServer.ffmpegFile
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.fimg"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":FIMG:"

      - type: ADCore.NDFileTIFF
        ENABLED: 1
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.tiff"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":TIFF:"

      - type: ADCore.NDFileHDF5
        ENABLED: 1
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.hdf"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":HDF5:"

      # ffmpegStream has no ENABLED parameter: gdaPlugins.template enables it
      - type: ffmpegServer.ffmpegStream
        P: "{{ P }}"
        R: ":MJPG:"
        PORT: "{{ PORTPREFIX }}.mjpg"
        NDARRAY_PORT: "{{ PORTPREFIX }}.over"
        QUEUE: "{{ DISPLAYQUEUE }}"
        HTTP_PORT: "{{ HTTP_PORT }}"

      - type: ADCore.NDPvxsPlugin
        ENABLED: 1
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.pva"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":PVA:"
        PVNAME: "{{ P }}:PVA:ARRAY"

      # last, so that its records load after the plugins' records they modify
      - type: detectorPlugins._gdaPluginsRecords
        P: "{{ P }}"
        CentroidThreshold: "{{ CentroidThreshold }}"
        ComputeProfiles: "{{ ComputeProfiles }}"
        ComputeStatistics: "{{ ComputeStatistics }}"
        ComputeCentroid: "{{ ComputeCentroid }}"

    # as adUtil 2-44's gdaPlugins emits them; SortMode is on only with threads > 1
    post_init:
      - value: |
          dbpf "{{ P }}:FIMG:FileTemplate", "%s/%s_%d.avi"
          dbpf "{{ P }}:HDF5:FileTemplate", "%s/%s_%d.h5"
          {%- for plugin in ["STAT", "ROI"] %}
          {%- for setting, value in [("NumThreads", threads), ("SortMode", 1 if threads > 1 else 0), ("SortTime", threadSortTime), ("SortSize", threadSortSize)] %}
          {%- for n in ["", "1", "2", "3", "4", "5", "6"] %}
          dbpf "{{ P }}:{{ plugin }}{{ n }}:{{ setting }}", "{{ value }}"
          {%- endfor %}
          {%- endfor %}
          {%- endfor %}

  - name: _gdaPluginsRecords
    description: |-
      The GDA helper records of gdaPlugins. Do not instantiate this directly:
      gdaPlugins creates it.
    parameters:
      P:
        type: str
        description: PV prefix for all plugins
      CentroidThreshold:
        type: int
        description: Threshold for calculating centroids in NDStats plugins
      ComputeProfiles:
        type: int
        description: Toggle computation of profiles in NDStats plugins (0 or 1)
      ComputeStatistics:
        type: int
        description: Toggle computation of basic statistics in NDStats plugins (0 or 1)
      ComputeCentroid:
        type: int
        description: Toggle computation of centroids in NDStats plugins (0 or 1)

    databases:
      - file: gdaPlugins.template
        args:
          P:
          CentroidThreshold:
          ComputeProfiles:
          ComputeStatistics:
          ComputeCentroid:

  - name: detectorPlugins
    description: Standard set of AreaDetector plugins for Ophyd
    parameters:
      P:
        type: str
        description: Prefix for the AreaDetector PVs
      CAM:
        type: str
        description: AreaDetector NDArray port name of the camera
      PORTPREFIX:
        type: str
        description: Prefix for all plugin ports
      NCHANS:
        type: int
        description: Number of channels for NDStats plugin
        default: 20000
      HIST_SIZE:
        type: int
        description: Histogram size for NDStats plugin
        default: 256
      XSIZE:
        type: int
        description: X size for NDStats plugin
        default: 1024
      YSIZE:
        type: int
        description: Y size for NDStats plugin
        default: 768
      MAX_ROIS:
        type: int
        description: Number of ROISTATs
        default: 8
      PLUGINQUEUE:
        type: int
        description: Queue size for all plugins
        default: 16

    sub_entities:
      - type: ADCore.NDPvxsPlugin
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.pva"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":PVA:"
        PVNAME: "{{ P }}:PVA:OUTPUT"

      - type: ADCore.NDStats
        HIST_SIZE: "{{ HIST_SIZE }}"
        NCHANS: "{{ NCHANS }}"
        NDARRAY_PORT: "{{ CAM }}"
        P: "{{ P }}"
        PORT: "{{ PORTPREFIX }}.stat"
        QUEUE: "{{ PLUGINQUEUE }}"
        R: ":STAT:"
        XSIZE: "{{ XSIZE }}"
        YSIZE: "{{ YSIZE }}"

      - type: ADCore.NDROIStat
        NDARRAY_PORT: "{{ PORTPREFIX }}.stat"
        P: "{{ P }}"
        R: ":ROISTAT:"
        PORT: "{{ PORTPREFIX }}.roistat"
        QUEUE: "{{ PLUGINQUEUE }}"
        MAX_ROIS: "{{ MAX_ROIS }}"
        NCHANS: "{{ NCHANS }}"

      - type: ADCore.NDFileHDF5
        PORT: "{{ PORTPREFIX }}.hdf5"
        NDARRAY_PORT: "{{ PORTPREFIX }}.roistat"
        P: "{{ P }}"
        R: ":HDF5:"
