# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.10.0/ibek.support.schema.json

# Imported from DLS production support module: BL21I 3-12
# Source: controls/support/BL21I (DLS GitLab), tag 3-12, BL21ISupportApp/Db
# Pristine copies of the EPICS templates from that release.
#
# BL21I is the I21 beamline's support module. Its templates are pure msi (no
# VDCT expand()) and use only soft records: ai, ao, bi, bo, calc, calcout,
# dfanout, fanout, mbbi, mbbo, seq, stringin and stringout from EPICS base,
# sseq and transform from calc, and busy from busy. So they run on a stock
# generic IOC image without compiling the module. The entity models and their parameters match
# ibek-support-dls/BL21I so that existing ioc.yaml files validate unchanged,
# except that the builder `name` parameter is not declared: it was never passed
# to a template, and builder2ibek drops it.
#
# Not in this pattern:
# - SCM10: the scientificInstSCM10 pattern in ibek-runtime-streamdevice.
# - FS1Control, DewarScales, ADCAcquisition, ADCAcquisitionGroup and
#   M4ADCSupport: tied to the EtherCAT IOC BL21I-DI-IOC-01 (asynInt32 records
#   on EtherCAT asyn ports, links to EtherCAT GenericADC and ERIO PVs), whose
#   EtherCAT support is being replaced.
#
# Only the templates and model entities an IOC actually needs may be vendored using:
# 'ibek pattern add ibek-runtime-support:BL21I@<release> <service> --only <template> --model <entity_model>'
#
# To check for updates: diff this pattern's files against a newer tag of
# controls/support/BL21I (BL21ISupportApp/Db).

module: BL21I

entity_models:
  - name: ARMAirControl
    description: |-
      Combined ARM air bearing control.
      Sets both ARM air bearings off and on simultaneously via
      master/slave valve controller configuration.
    parameters:
      P:
        type: str
        description: EPICS name prefix
      R:
        type: str
        description: EPICS name suffix
      MASTERCTLR:
        type: str
        description: |-
          Record for master valve controller (Granite air ctrl)
      SLAVECTLR:
        type: str
        description: |-
          Record for slave valve controller (Marble air ctrl)
      MOTORSTATUS:
        type: str
        description: |-
          PV for the motor status bits.
          The motor status indicates whether air supply is on and the motor
          is ready to move (problem status bit cleared).
    databases:
      - file: BL21I_ARM_Air_Control.template
        args:
          .*:

  - name: AirBearingInterlockWait
    description: |-
      Controls the interlock logic for the air bearings.
      Triggers valves to open and waits for motor interlock to clear
      with a specified timeout.
    parameters:
      P:
        type: str
        description: EPICS name prefix
      R:
        type: str
        description: EPICS name suffix
      OUT:
        type: str
        description: |-
          Record for air control output
      TIMEOUT:
        type: float
        description: |-
          Timeout for interlock wait
        default: 10
      MOTORSTATUS:
        type: str
        description: |-
          PV for the motor status bits.
          The motor status indicates whether air supply is on and the motor
          is ready to move (problem status bit cleared).
      DESC:
        type: str
        description: |-
          Description for the air control
        default: "Air Bearing Control"
    databases:
      - file: BL21I_Air_Bearing_Interlock_Wait.template
        args:
          .*:

  - name: SGMr1AirControl
    description: |-
      SGM Traveller air bearing control.
      Sets the SGM Air bearing off and on with input of 0 and 1 respectively.
    parameters:
      P:
        type: str
        description: EPICS name prefix
      R:
        type: str
        description: EPICS name suffix
      AIRVALVE:
        type: str
        description: |-
          Record for SGM Traveller air bearing valve control
      MOTORSTATUS:
        type: str
        description: |-
          PV for the motor status bits.
          The motor status indicates whether air supply is on and the motor
          is ready to move (problem status bit cleared).
    databases:
      - file: BL21I_SGM_Traveller_Air_Control.template
        args:
          .*:

  - name: SMPLValveSequence
    description: |-
      Sample valve sequence control.
      Triggers a defined sequence of vacuum component controls
      for reinstating vacuum after a change of sample.
      If a fast valve is involved, an 'arm' delay is required
      because no callback for this state is provided in dlsPLC;
      a pause is also required once the 'open disarmed' state is
      reached before the 'arm' command can take effect. From testing
      on i21, a 30 seconds delay is recommended for a fast valve.
      The status of each vacuum component is periodically monitored
      and sequence steps are disabled accordingly.
      Currently, the open sequence doesn't include the 5th component
      in the sequence.
    parameters:
      P:
        type: str
        description: EPICS name prefix
      R:
        type: str
        description: EPICS name suffix
      VACNAME1:
        type: str
        description: |-
          Short name for first vacuum element in the sequence
        default: VALVE-01
      DEVICE1:
        type: str
        description: |-
          PV for first vacuum element in the sequence
      DELAY1:
        type: float
        description: |-
          ARM delay in seconds after open disarmed state
        default: 0
      VACNAME2:
        type: str
        description: |-
          Short name for second vacuum element in the sequence
        default: VALVE-01
      DEVICE2:
        type: str
        description: |-
          PV for second vacuum element in the sequence
      DELAY2:
        type: float
        description: |-
          ARM delay in seconds after open disarmed state
        default: 0
      VACNAME3:
        type: str
        description: |-
          Short name for third vacuum element in the sequence
        default: VALVE-01
      DEVICE3:
        type: str
        description: |-
          PV for third vacuum element in the sequence
      DELAY3:
        type: float
        description: |-
          ARM delay in seconds after open disarmed state
        default: 0
      VACNAME4:
        type: str
        description: |-
          Short name for fourth vacuum element in the sequence
        default: VALVE-01
      DEVICE4:
        type: str
        description: |-
          PV for fourth vacuum element in the sequence
      DELAY4:
        type: float
        description: |-
          ARM delay in seconds after open disarmed state
        default: 0
      VACNAME5:
        type: str
        description: |-
          Short name for fifth vacuum element in the sequence
        default: VALVE-01
      DEVICE5:
        type: str
        description: |-
          PV for fifth vacuum element in the sequence
      DELAY5:
        type: float
        description: |-
          ARM delay in seconds after open disarmed state
        default: 0
    databases:
      - file: BL21I_SMPL_Valve_Sequence.template
        args:
          .*:

  - name: TTHBumpstripMonitor
    description: |-
      TTH bumpstrip monitoring.
      Provides an archived counter incremented on each bumpstrip contact,
      enabling identification of when the bumpstrip was last activated.
    parameters:
      P:
        type: str
        description: Bumpstrip EPICS name prefix
      R:
        type: str
        description: Bumpstrip EPICS name suffix
      DESC:
        type: str
        description: |-
          Bumpstrip description
    databases:
      - file: BL21I_TTH_Bumpstrip_Monitor.template
        args:
          .*:

  - name: M5LimitLatch
    description: |-
      Latch for the M5 limit switches, plus a status and reset PV.
      Provides STATUS and RESET PVs.
    parameters:
      P:
        type: str
        description: EPICS name prefix
      R:
        type: str
        description: EPICS name suffix
      LIMITS:
        type: str
        description: |-
          EPICS Limit switch name prefix
    databases:
      - file: BL21I_M5_Smarpod_Limit_Latch.template
        args:
          .*:

  - name: M5LimitStop
    description: |-
      Template for sending stop commands when any of the limits is triggered.
      This assumes that a limit is triggered when it equals 0.
    parameters:
      P:
        type: str
        description: EPICS name prefix
      R:
        type: str
        description: EPICS name suffix
      LIMIT_PREFIX:
        type: str
        description: |-
          The prefix used for the Smarpod limits
      LIMIT1:
        type: str
        description: |-
          Limit A suffix
        default: ":LIM1"
      LIMIT2:
        type: str
        description: |-
          Limit B suffix
        default: ":LIM2"
      LIMIT3:
        type: str
        description: |-
          Limit C suffix
        default: ":LIM3"
      LIMIT4:
        type: str
        description: |-
          Limit D suffix
        default: ":LIM4"
      LIMIT5:
        type: str
        description: |-
          Limit E suffix
        default: ":LIM5"
      LIMIT6:
        type: str
        description: |-
          Limit F suffix
        default: ":LIM6"
      LIMIT7:
        type: str
        description: |-
          Limit G suffix
        default: ":LIM7"
      STOPLINK1:
        type: str
        description: |-
          The record used to stop Smarpod one
      STOPLINK2:
        type: str
        description: |-
          The record used to stop Smarpod two
    databases:
      - file: BL21I_M5_Smarpod_Limit_Stop.template
        args:
          .*:

  - name: SMPLTempsController
    description: |-
      Improved Lakeshore336 control screen for the I21 Sample Chamber.
      Provides user-friendly ramp rate control and temperature input selection
      on top of the standard Lakeshore336 records.
    parameters:
      prefix:
        type: str
        description: EPICS PV prefix
      LAKESHORE:
        type: str
        description: |-
          EPICS PV prefix for the Lakeshore336 device records
      INPUT1:
        type: str
        description: |-
          Descriptive name for temperature readback 1
      INPUT2:
        type: str
        description: |-
          Descriptive name for temperature readback 2
      INPUT3:
        type: str
        description: |-
          Descriptive name for temperature readback 3
      INPUT4:
        type: str
        description: |-
          Descriptive name for temperature readback 4
      DESC:
        type: str
        description: |-
          Description of this template in IOC
    databases:
      - file: BL21I_SMPL_Temps_Controller.template
        args:
          .*:

  - name: SMPLCollisionLimits
    description: |-
      SMPL collision limits for preventing collision between the sample
      manipulator and the M5 mirror system. Provides dynamic XY limits
      based on current motor positions plus fixed safety limits.
    parameters:
      P:
        type: str
        description: EPICS name prefix
      R:
        type: str
        description: EPICS name suffix
      SMPLX:
        type: str
        description: |-
          EPICS PV for Sample X axis
      SMPLY:
        type: str
        description: |-
          EPICS PV for Sample Y axis
      RADIUS:
        type: float
        description: |-
          Default XY radius of freedom (mm) around the centre set by the home positions
      FIXED_LLIM:
        type: float
        description: |-
          Fixed SMPL_X and SMPL_Y LLIM when dynamic limits are disabled (mm)
      FIXED_HLIM:
        type: float
        description: |-
          Fixed SMPL_X and SMPL_Y HLIM when dynamic limits are disabled (mm)
    databases:
      - file: BL21I_SMPL_Collision_Limits.template
        args:
          .*:

  - name: S2DiodeDifference
    description: |-
      Normalised difference between two slit drain currents.
      Used for BLFeedback.
    parameters:
      P:
        type: str
        description: EPICS name prefix
      R:
        type: str
        description: EPICS name suffix
      PREC:
        type: int
        description: |-
          Precision for all values
      FEMTO1:
        type: str
        description: |-
          Prefix for femto on negative side
      FEMTO2:
        type: str
        description: |-
          Prefix for femto on positive side
      MINVAL:
        type: float
        description: |-
          Minimum value for given ADC
    databases:
      - file: BL21I_S2_Diode_Difference.template
        args:
          .*:

  - name: FeedbackAutoPv
    description: |-
      Shutter-like AutoPV for BLfeedback.
      Triggers feedback for a given period of time, but not when TopUp
      is about to occur.
    parameters:
      prefix:
        type: str
        description: EPICS PV prefix
      FEEDBACK_TIME:
        type: float
        description: |-
          Duration of feedback, in seconds
      PULSE_DELAY:
        type: float
        description: |-
          Number of seconds between feedback pulses in Pulsed mode
      DESC:
        type: str
        description: |-
          Description of this template in IOC
        default: "Feedback control"
    databases:
      - file: BL21I_Feedback_Auto_Pv.template
        args:
          .*:
