# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/4.10.0/ibek.support.schema.json

# Imported from DLS production support module: pgmNextGen 4-1
# Source: controls/support/pgmNextGen (DLS GitLab), tag 4-1, pgmNextGenApp/Db
#
# PGM.template, AutoDecouple.template and pgmNextGenCal.template are pristine
# copies of the module's own templates. pgmNextGen 4-1's Makefile builds
# pgmNextGen.db and pgmNextGenCalibration.db from pgmNextGen.substitutions and
# pgmNextGenCalibration.substitutions with msi. The expansion that the
# Makefile and msi did at build time is done per instance by ibek: each entry
# in an entity model's `databases:` list below is one row of a substitutions
# file, in the same order, with the row and its line number in the comment
# above it. The files are otherwise pristine.
#
# The substitutions files also load templates from two other support modules,
# which the generic IOC image builds:
#   $(PMAC)/db/pmacVariableWrite.template        pmac
#   $(POSITIONER)/db/multipositioner.template    positioner
#   $(POSITIONER)/db/positioner.template         positioner
#   $(POSITIONER)/db/motorpositioner.template    positioner
# They are named below without the $(PMAC)/db/ or $(POSITIONER)/db/ folder:
# msi finds them on the IOC's ${SUPPORT}/*/db include path. pgmNextGen 4-1
# built against pmac 2-5-22 and positioner 3-8; the IOC uses the versions its
# image builds.
#
# How the substitutions macros map:
#   $(X)                     a parameter of the entity, written {{X}}
#   $(dollar=$)(X=default)   a parameter of the entity with that default; the
#                            escape only carried the macro past the module
#                            build to the IOC build
# A few rows take a macro that is not a column of the substitutions row: one
# that the 4-1 build left unexpanded in its .db for the IOC build to set, such
# as VARIABLE_PREC in pmacVariableWrite.template. The comment above each such
# block names it.
#
# pgmNextGen supports Plane Grating Monochromators (PGMs) running on Delta
# Tau motion controllers. Its library has no code of its own: it only
# aggregates dbds. The records are ai, ao, bi, bo, calc, calcout, dfanout,
# fanout, longout, mbbo, sel, seq and stringout from EPICS base, with
# stringin "Soft Timestamp"; scalcout, sseq and transform from calc; busy
# from busy; soft channel motor records from motor; and asyn records plus
# asynFloat64 records that read and write PMAC variables through the pmac
# driver's parameters. So they run on a generic IOC image that builds calc,
# busy, motor, pmac and positioner, such as ioc-pmac, with no compiling.
#
# The entity model names are the builder class names and the parameter names
# are the builder XML attribute names. The builder `name` parameter is not
# declared: no record uses it, and builder2ibek drops it. NPOS is declared,
# although only GUI comments use it, because IOCs set it.
#
# To check for updates: diff the three templates and the two substitutions
# files of a newer tag of controls/support/pgmNextGen against 4-1.

module: pgmNextGen

entity_models:
  - name: pgmNextGen
    description: |-
      Plane Grating Monochromator on a Delta Tau motion controller: energy
      and CFF co-ordinate system variables, grating and mirror selection
      positioners, and automatic decoupling of the translation motors.
    # in the order the rows of pgmNextGen.substitutions first use them
    parameters:
      # pmacVariableWrite.template rows and PGM.template row
      P:
        type: str
        description: Device prefix for the PGM
      PITCH_PORT:
        type: str
        description: |-
          Asyn port of the PMAC that the Energy co-ordinate system and the
          pitch motors are on
      COORD_NUM:
        type: int
        description: Delta Tau co-ordinate system number used for the PGM Energy
      GRATING_AXIS:
        type: int
        description: |-
          Axis number of the grating pitch motor (reads P<axis> as BETA)
      MIRROR_AXIS:
        type: int
        description: |-
          Axis number of the mirror pitch motor (reads P<axis> as THETA)
      VARIABLE_PREC:
        type: int
        description: Display precision of the PMAC variable records
      GRATINGPITCH:
        type: str
        description: Name of grating pitch motor excluding the device prefix
      MIRRORPITCH:
        type: str
        description: Name of mirror pitch motor excluding the device prefix

      # AutoDecouple.template rows
      GRAT_DECOUPLE_DIST:
        type: float
        description: |-
          Size of the extra grating translation move that decouples
          (unlatches) the pitch
      GRATING_TRANS_REAL_MOTOR:
        type: str
        description: Name of the real grating translation motor
      GRATING_TRANS_SOFT_MOTOR:
        type: str
        description: |-
          Name of the soft motor presented to the user to demand grating
          translation
      MIRR_DECOUPLE_DIST:
        type: float
        description: |-
          Size of the extra mirror translation move that decouples
          (unlatches) the pitch
      MIRROR_TRANS_REAL_MOTOR:
        type: str
        description: Name of the real mirror translation motor
      MIRROR_TRANS_SOFT_MOTOR:
        type: str
        description: |-
          Name of the soft motor presented to the user to demand mirror
          translation
      POST_DECOUPLE_DELAY:
        type: float
        description: |-
          Delay in seconds to allow for the disengaged couple (latch) switch
          signal to update the pitch motor record status
        default: 0

      # multipositioner.template and positioner.template rows; GSTRA-E come
      # first because the GLABA-E defaults use them
      GSTRA:
        type: str
        description: |-
          Line density of grating 1 in lines/mm; must be numeric, it is used
          in the Energy and CFF calculations
      GSTRB:
        type: str
        description: |-
          Line density of grating 2 in lines/mm; must be numeric, it is used
          in the Energy and CFF calculations
      GSTRC:
        type: str
        description: |-
          Line density of grating 3 in lines/mm; must be numeric, it is used
          in the Energy and CFF calculations
      GSTRD:
        type: str
        description: |-
          Line density of grating 4 in lines/mm; must be numeric, it is used
          in the Energy and CFF calculations
      GSTRE:
        type: str
        description: |-
          Line density of grating 5 in lines/mm; must be numeric, it is used
          in the Energy and CFF calculations
      GLABA:
        type: str
        description: Label of grating 1
        default: "{{GSTRA}} lines/mm"
      GLABB:
        type: str
        description: Label of grating 2
        default: "{{GSTRB}} lines/mm"
      GLABC:
        type: str
        description: Label of grating 3
        default: "{{GSTRC}} lines/mm"
      GLABD:
        type: str
        description: Label of grating 4
        default: "{{GSTRD}} lines/mm"
      GLABE:
        type: str
        description: Label of grating 5
        default: "{{GSTRE}} lines/mm"
      MSTRA:
        type: str
        description: Label of mirror 1
      MSTRB:
        type: str
        description: Label of mirror 2
      MSTRC:
        type: str
        description: Label of mirror 3
      MSTRD:
        type: str
        description: Label of mirror 4
      MSTRE:
        type: str
        description: Label of mirror 5

      # motorpositioner.template rows
      GPOSA:
        type: float
        description: Grating translation position of grating 1
      GPOSB:
        type: float
        description: Grating translation position of grating 2
      GPOSC:
        type: float
        description: Grating translation position of grating 3
      GPOSD:
        type: float
        description: Grating translation position of grating 4
      GPOSE:
        type: float
        description: Grating translation position of grating 5
      MPOSA:
        type: float
        description: Mirror translation position of mirror 1
      MPOSB:
        type: float
        description: Mirror translation position of mirror 2
      MPOSC:
        type: float
        description: Mirror translation position of mirror 3
      MPOSD:
        type: float
        description: Mirror translation position of mirror 4
      MPOSE:
        type: float
        description: Mirror translation position of mirror 5

      # used by no row
      NPOS:
        type: int
        description: |-
          Number of positioners. Used by builder only to choose a GUI
          screen; no record uses it.
        default: 1

    # pgmNextGen.substitutions, row by row
    databases:
      # line 6: file $(PMAC)/db/pmacVariableWrite.template
      #         pattern { P, Q, PORT, VAR, EGU }
      # VARIABLE_PREC is not a column: 4-1 left $(VARIABLE_PREC) in
      # pgmNextGen.db for the IOC build to set.

      # line 9: { $(P), :LINES, $(PITCH_PORT), &$(COORD_NUM)Q21, ""}
      - file: pmacVariableWrite.template
        args: {P: "{{P}}", Q: ":LINES", PORT: "{{PITCH_PORT}}", VAR: "&{{COORD_NUM}}Q21", EGU: "",
               VARIABLE_PREC: "{{VARIABLE_PREC}}"}
      # line 10: { $(P), :ORDER, $(PITCH_PORT), &$(COORD_NUM)Q22, ""}
      - file: pmacVariableWrite.template
        args: {P: "{{P}}", Q: ":ORDER", PORT: "{{PITCH_PORT}}", VAR: "&{{COORD_NUM}}Q22", EGU: "",
               VARIABLE_PREC: "{{VARIABLE_PREC}}"}
      # line 11: { $(P), :ENERGYDEMAND, $(PITCH_PORT), &$(COORD_NUM)Q77, eV}
      - file: pmacVariableWrite.template
        args: {P: "{{P}}", Q: ":ENERGYDEMAND", PORT: "{{PITCH_PORT}}", VAR: "&{{COORD_NUM}}Q77", EGU: "eV",
               VARIABLE_PREC: "{{VARIABLE_PREC}}"}
      # line 12: { $(P), :CFFDEMAND, $(PITCH_PORT), &$(COORD_NUM)Q78, ""}
      - file: pmacVariableWrite.template
        args: {P: "{{P}}", Q: ":CFFDEMAND", PORT: "{{PITCH_PORT}}", VAR: "&{{COORD_NUM}}Q78", EGU: "",
               VARIABLE_PREC: "{{VARIABLE_PREC}}"}
      # line 13: { $(P), :BETA, $(PITCH_PORT), P$(GRATING_AXIS), deg}
      - file: pmacVariableWrite.template
        args: {P: "{{P}}", Q: ":BETA", PORT: "{{PITCH_PORT}}", VAR: "P{{GRATING_AXIS}}", EGU: "deg",
               VARIABLE_PREC: "{{VARIABLE_PREC}}"}
      # line 14: { $(P), :THETA, $(PITCH_PORT), P$(MIRROR_AXIS), deg}
      - file: pmacVariableWrite.template
        args: {P: "{{P}}", Q: ":THETA", PORT: "{{PITCH_PORT}}", VAR: "P{{MIRROR_AXIS}}", EGU: "deg",
               VARIABLE_PREC: "{{VARIABLE_PREC}}"}
      # line 15: { $(P), :CURRENTENERGY, $(PITCH_PORT), &$(COORD_NUM)Q7, eV}
      - file: pmacVariableWrite.template
        args: {P: "{{P}}", Q: ":CURRENTENERGY", PORT: "{{PITCH_PORT}}", VAR: "&{{COORD_NUM}}Q7", EGU: "eV",
               VARIABLE_PREC: "{{VARIABLE_PREC}}"}
      # (lines 16-17 are the commented-out :CFF row)

      # line 20: file PGM.template
      #          pattern {P, PORT, COORD_NUM}
      # GRATINGPITCH and MIRRORPITCH are not columns: 4-1 left them in
      # pgmNextGen.db for the IOC build to set.

      # line 23: {$(P), $(PITCH_PORT), $(COORD_NUM)}
      - file: PGM.template
        args: {P: "{{P}}", PORT: "{{PITCH_PORT}}", COORD_NUM: "{{COORD_NUM}}",
               GRATINGPITCH: "{{GRATINGPITCH}}", MIRRORPITCH: "{{MIRRORPITCH}}"}

      # line 33: file AutoDecouple.template
      #          pattern {P, DECOUPLING_DISTANCE, REAL_MOTOR, SOFT_MOTOR, DESC, POST_DECOUPLE_DELAY}

      # line 36: {$(P), $(GRAT_DECOUPLE_DIST), $(GRATING_TRANS_REAL_MOTOR), $(GRATING_TRANS_SOFT_MOTOR),
      #           "Grating Translation", $(dollar=$)(POST_DECOUPLE_DELAY=0)}
      - file: AutoDecouple.template
        args: {P: "{{P}}", DECOUPLING_DISTANCE: "{{GRAT_DECOUPLE_DIST}}",
               REAL_MOTOR: "{{GRATING_TRANS_REAL_MOTOR}}", SOFT_MOTOR: "{{GRATING_TRANS_SOFT_MOTOR}}",
               DESC: "Grating Translation", POST_DECOUPLE_DELAY: "{{POST_DECOUPLE_DELAY}}"}
      # line 37: {$(P), $(MIRR_DECOUPLE_DIST), $(MIRROR_TRANS_REAL_MOTOR), $(MIRROR_TRANS_SOFT_MOTOR),
      #           "Mirror Translation", $(dollar=$)(POST_DECOUPLE_DELAY=0)}
      - file: AutoDecouple.template
        args: {P: "{{P}}", DECOUPLING_DISTANCE: "{{MIRR_DECOUPLE_DIST}}",
               REAL_MOTOR: "{{MIRROR_TRANS_REAL_MOTOR}}", SOFT_MOTOR: "{{MIRROR_TRANS_SOFT_MOTOR}}",
               DESC: "Mirror Translation", POST_DECOUPLE_DELAY: "{{POST_DECOUPLE_DELAY}}"}

      # line 42: file $(POSITIONER)/db/multipositioner.template
      #          pattern {P, MP, DESC, STRA, STRB, STRC, STRD, STRE, STRF, STRG, STRH, STRI, STRJ, STRK,
      #                   STRL, gda_name, gda_desc }

      # line 45: {$(P), :GRATINGSELECT, "Grating Positioner", "$(dollar=$)(GLABA=$(GSTRA) lines/mm)",
      #           "$(dollar=$)(GLABB=$(GSTRB) lines/mm)", "$(dollar=$)(GLABC=$(GSTRC) lines/mm)",
      #           "$(dollar=$)(GLABD=$(GSTRD) lines/mm)", "$(dollar=$)(GLABE=$(GSTRE) lines/mm)",
      #           "", "", "", "", "", "", "", PGM.GRATINGSELECT, "Grating Selection"}
      - file: multipositioner.template
        args: {P: "{{P}}", MP: ":GRATINGSELECT", DESC: "Grating Positioner",
               STRA: "{{GLABA}}", STRB: "{{GLABB}}", STRC: "{{GLABC}}", STRD: "{{GLABD}}", STRE: "{{GLABE}}",
               STRF: "", STRG: "", STRH: "", STRI: "", STRJ: "", STRK: "", STRL: "",
               gda_name: "PGM.GRATINGSELECT", gda_desc: "Grating Selection"}
      # line 46: {$(P), :MIRRORSELECT, "Mirror Positioner", $(MSTRA), $(MSTRB), $(MSTRC), $(MSTRD), $(MSTRE),
      #           "", "", "", "", "", "", "", PGM.MIRRORSELECT, "Mirror Selection"}
      - file: multipositioner.template
        args: {P: "{{P}}", MP: ":MIRRORSELECT", DESC: "Mirror Positioner",
               STRA: "{{MSTRA}}", STRB: "{{MSTRB}}", STRC: "{{MSTRC}}", STRD: "{{MSTRD}}", STRE: "{{MSTRE}}",
               STRF: "", STRG: "", STRH: "", STRI: "", STRJ: "", STRK: "", STRL: "",
               gda_name: "PGM.MIRRORSELECT", gda_desc: "Mirror Selection"}

      # line 53: file $(POSITIONER)/db/positioner.template
      #          pattern {P, Q, MP, DESC, SET, EGU, PREC, READBACK, STOP, STOPVAL, DEADBAND, VALA, VALB,
      #                   VALC, VALD, VALE, VALF, VALFG, VALH, VALI, VALJ, VALK, VALL, pos}
      # VALFG is kept as spelt there; positioner.template has no such macro,
      # so its VALG keeps its default, as in 4-1.

      # line 56: {$(P), ":GRATLINE", :GRATINGSELECT, "Grating Selection", :LINES, "lines/mm", 1, :LINES,
      #           0, 0, 0, $(GSTRA), $(GSTRB), $(GSTRC), $(GSTRD), $(GSTRE), "", "", "", "", "", "", "", A}
      - file: positioner.template
        args: {P: "{{P}}", Q: ":GRATLINE", MP: ":GRATINGSELECT", DESC: "Grating Selection",
               SET: ":LINES", EGU: "lines/mm", PREC: "1", READBACK: ":LINES",
               STOP: "0", STOPVAL: "0", DEADBAND: "0",
               VALA: "{{GSTRA}}", VALB: "{{GSTRB}}", VALC: "{{GSTRC}}", VALD: "{{GSTRD}}", VALE: "{{GSTRE}}",
               VALF: "", VALFG: "", VALH: "", VALI: "", VALJ: "", VALK: "", VALL: "", pos: "A"}

      # line 59: file $(POSITIONER)/db/motorpositioner.template
      #          pattern {P, Q, MP, DESC, EGU, PREC, motor, VALA, VALB, VALC, VALD, VALE, VALF, VALG,
      #                   VALH, VALI, VALJ, VALK, VALL, pos }

      # line 62: {$(P), :GRATINGPOS, :GRATINGSELECT, "Grating Position", "mm", 5,
      #           :$(GRATING_TRANS_SOFT_MOTOR), $(GPOSA), $(GPOSB), $(GPOSC), $(GPOSD), $(GPOSE),
      #           0, 0, 0, 0, 0, 0, 0, B}
      - file: motorpositioner.template
        args: {P: "{{P}}", Q: ":GRATINGPOS", MP: ":GRATINGSELECT", DESC: "Grating Position",
               EGU: "mm", PREC: "5", motor: ":{{GRATING_TRANS_SOFT_MOTOR}}",
               VALA: "{{GPOSA}}", VALB: "{{GPOSB}}", VALC: "{{GPOSC}}", VALD: "{{GPOSD}}", VALE: "{{GPOSE}}",
               VALF: "0", VALG: "0", VALH: "0", VALI: "0", VALJ: "0", VALK: "0", VALL: "0", pos: "B"}
      # line 63: {$(P), :MIRRORPOS, :MIRRORSELECT, "Mirror Position", "mm", 5,
      #           :$(MIRROR_TRANS_SOFT_MOTOR), $(MPOSA), $(MPOSB), $(MPOSC), $(MPOSD), $(MPOSE),
      #           0, 0, 0, 0, 0, 0, 0, A}
      - file: motorpositioner.template
        args: {P: "{{P}}", Q: ":MIRRORPOS", MP: ":MIRRORSELECT", DESC: "Mirror Position",
               EGU: "mm", PREC: "5", motor: ":{{MIRROR_TRANS_SOFT_MOTOR}}",
               VALA: "{{MPOSA}}", VALB: "{{MPOSB}}", VALC: "{{MPOSC}}", VALD: "{{MPOSD}}", VALE: "{{MPOSE}}",
               VALF: "0", VALG: "0", VALH: "0", VALI: "0", VALJ: "0", VALK: "0", VALL: "0", pos: "A"}

  - name: pgmNextGenCalibration
    description: |-
      Calibration tables of the grating and mirror pitch offsets of a
      pgmNextGen PGM, for each combination of grating and mirror.
    # in the order the rows of pgmNextGenCalibration.substitutions first use
    # them
    parameters:
      # pgmNextGenCal.template rows
      P:
        type: str
        description: Device prefix for the PGM
      GRATINGPITCH:
        type: str
        description: Name of grating pitch motor excluding the device prefix
      GRATINGCAL:
        type: str
        description: Field of the grating pitch motor that the calibration sets
        default: .OFF
      PITCHEGU:
        type: str
        description: Engineering units for the pitch
        default: deg
      PITCHPREC:
        type: int
        description: Display precision for the pitch
        default: 8
      GRATINGDESC:
        type: str
        description: Description of the grating pitch motor
        default: Grating Pitch
      GRTCLBDESC:
        type: str
        description: Label of the grating calibration table
        default: Grating - Beta Calibration
      MIRRORPITCH:
        type: str
        description: Name of mirror pitch motor excluding the device prefix
      MIRRORCAL:
        type: str
        description: Field of the mirror pitch motor that the calibration sets
        default: .OFF
      MIRRORDESC:
        type: str
        description: Description of the mirror pitch motor
        default: Mirror Pitch
      MIRCLBDESC:
        type: str
        description: Label of the mirror calibration table
        default: Mirror - Theta Calibration

      # multipositioner.template rows; GSTRA-E come first because the
      # GLABA-E defaults use them
      GSTRA:
        type: str
        description: |-
          Line density of grating 1 in lines/mm, used only in the default
          label of grating 1
      GSTRB:
        type: str
        description: |-
          Line density of grating 2 in lines/mm, used only in the default
          label of grating 2
      GSTRC:
        type: str
        description: |-
          Line density of grating 3 in lines/mm, used only in the default
          label of grating 3
      GSTRD:
        type: str
        description: |-
          Line density of grating 4 in lines/mm, used only in the default
          label of grating 4
      GSTRE:
        type: str
        description: |-
          Line density of grating 5 in lines/mm, used only in the default
          label of grating 5
      GLABA:
        type: str
        description: Label of grating 1
        default: "{{GSTRA}} lines/mm"
      GLABB:
        type: str
        description: Label of grating 2
        default: "{{GSTRB}} lines/mm"
      GLABC:
        type: str
        description: Label of grating 3
        default: "{{GSTRC}} lines/mm"
      GLABD:
        type: str
        description: Label of grating 4
        default: "{{GSTRD}} lines/mm"
      GLABE:
        type: str
        description: Label of grating 5
        default: "{{GSTRE}} lines/mm"

      # positioner.template rows :CLB:GRT:M1 to :CLB:GRT:M5
      G_G1M1:
        type: float
        description: Grating pitch calibration offset for grating 1 with mirror 1
        default: 90
      G_G2M1:
        type: float
        description: Grating pitch calibration offset for grating 2 with mirror 1
        default: 90
      G_G3M1:
        type: float
        description: Grating pitch calibration offset for grating 3 with mirror 1
        default: 90
      G_G4M1:
        type: float
        description: Grating pitch calibration offset for grating 4 with mirror 1
        default: 90
      G_G5M1:
        type: float
        description: Grating pitch calibration offset for grating 5 with mirror 1
        default: 90
      G_G1M2:
        type: float
        description: Grating pitch calibration offset for grating 1 with mirror 2
        default: 90
      G_G2M2:
        type: float
        description: Grating pitch calibration offset for grating 2 with mirror 2
        default: 90
      G_G3M2:
        type: float
        description: Grating pitch calibration offset for grating 3 with mirror 2
        default: 90
      G_G4M2:
        type: float
        description: Grating pitch calibration offset for grating 4 with mirror 2
        default: 90
      G_G5M2:
        type: float
        description: Grating pitch calibration offset for grating 5 with mirror 2
        default: 90
      G_G1M3:
        type: float
        description: Grating pitch calibration offset for grating 1 with mirror 3
        default: 90
      G_G2M3:
        type: float
        description: Grating pitch calibration offset for grating 2 with mirror 3
        default: 90
      G_G3M3:
        type: float
        description: Grating pitch calibration offset for grating 3 with mirror 3
        default: 90
      G_G4M3:
        type: float
        description: Grating pitch calibration offset for grating 4 with mirror 3
        default: 90
      G_G5M3:
        type: float
        description: Grating pitch calibration offset for grating 5 with mirror 3
        default: 90
      G_G1M4:
        type: float
        description: Grating pitch calibration offset for grating 1 with mirror 4
        default: 90
      G_G2M4:
        type: float
        description: Grating pitch calibration offset for grating 2 with mirror 4
        default: 90
      G_G3M4:
        type: float
        description: Grating pitch calibration offset for grating 3 with mirror 4
        default: 90
      G_G4M4:
        type: float
        description: Grating pitch calibration offset for grating 4 with mirror 4
        default: 90
      G_G5M4:
        type: float
        description: Grating pitch calibration offset for grating 5 with mirror 4
        default: 90
      G_G1M5:
        type: float
        description: Grating pitch calibration offset for grating 1 with mirror 5
        default: 90
      G_G2M5:
        type: float
        description: Grating pitch calibration offset for grating 2 with mirror 5
        default: 90
      G_G3M5:
        type: float
        description: Grating pitch calibration offset for grating 3 with mirror 5
        default: 90
      G_G4M5:
        type: float
        description: Grating pitch calibration offset for grating 4 with mirror 5
        default: 90
      G_G5M5:
        type: float
