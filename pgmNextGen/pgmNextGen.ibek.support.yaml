      M_G4M2:
        type: float
        description: Mirror pitch calibration offset for grating 4 with mirror 2
        default: 90
      M_G5M2:
        type: float
        description: Mirror pitch calibration offset for grating 5 with mirror 2
        default: 90
      M_G1M3:
        type: float
        description: Mirror pitch calibration offset for grating 1 with mirror 3
        default: 90
      M_G2M3:
        type: float
        description: Mirror pitch calibration offset for grating 2 with mirror 3
        default: 90
      M_G3M3:
        type: float
        description: Mirror pitch calibration offset for grating 3 with mirror 3
        default: 90
      M_G4M3:
        type: float
