        default: 90

      # positioner.template rows :CLB:MIR:M1 to :CLB:MIR:M5
      M_G1M1:
        type: float
        description: Mirror pitch calibration offset for grating 1 with mirror 1
        default: 90
      M_G2M1:
        type: float
        description: Mirror pitch calibration offset for grating 2 with mirror 1
        default: 90
      M_G3M1:
        type: float
        description: Mirror pitch calibration offset for grating 3 with mirror 1
        default: 90
      M_G4M1:
        type: float
        description: Mirror pitch calibration offset for grating 4 with mirror 1
        default: 90
      M_G5M1:
        type: float
        description: Mirror pitch calibration offset for grating 5 with mirror 1
        default: 90
      M_G1M2:
        type: float
        description: Mirror pitch calibration offset for grating 1 with mirror 2
        default: 90
      M_G2M2:
        type: float
        description: Mirror pitch calibration offset for grating 2 with mirror 2
        default: 90
      M_G3M2:
        type: float
        description: Mirror pitch calibration offset for grating 3 with mirror 2
